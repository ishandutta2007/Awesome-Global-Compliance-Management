<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .metric-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #f1f5f9;
      }

      /* Animated CSS Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatDelay {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.35; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes flowLight {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatDelay 7s ease-in-out infinite;
      }
      .floating-card-3 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .grid-lines {
        animation: pulseGrid 4s ease-in-out infinite;
      }
      .radar-needle {
        transform-origin: 1020px 180px;
        animation: radarSweep 10s linear infinite;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: flowLight 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Decorative Grid Matrix (Animated Opacity) -->
  <g class="grid-lines" stroke="#334155" stroke-width="0.75" stroke-dasharray="4,4">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Background Decorative Radar Graphic (Right Hemisphere) -->
  <g opacity="0.35">
    <circle cx="1020" cy="180" r="140" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="1020" cy="180" r="100" fill="none" stroke="#334155" stroke-width="1.2" />
    <circle cx="1020" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1020" cy="180" r="20" fill="#0284c7" fill-opacity="0.2" />
    <line x1="880" y1="180" x2="1160" y2="180" stroke="#334155" stroke-width="1" />
    <line x1="1020" y1="40" x2="1020" y2="320" stroke="#334155" stroke-width="1" />
    <!-- Rotating Radar Beam -->
    <line class="radar-needle" x1="1020" y1="180" x2="1020" y2="40" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Flow Light Streams -->
  <path class="data-stream" d="M 620,80 Q 750,50 880,120 T 1020,180" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4" />
  <path class="data-stream" d="M 660,300 Q 800,320 920,260 T 1020,180" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- DYNAMIC FLOATING PILLS & CARDS (In background/midground relative to text) -->
  <!-- Floating Pill 1: GDPR / DORA Statutory Clock -->
  <g class="floating-card-1" transform="translate(860, 52)">
    <rect width="180" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" filter="url(#cardGlow)" />
    <circle cx="22" cy="21" r="6" fill="#10b981" />
    <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">NIS2 &amp; DORA • Ready</text>
  </g>

  <!-- Floating Pill 2: SOC 2 & ISO Controls -->
  <g class="floating-card-2" transform="translate(940, 260)">
    <rect width="200" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1" filter="url(#cardGlow)" />
    <circle cx="22" cy="21" r="6" fill="#38bdf8" />
    <text x="36" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">ISO 27001 • Controls Pass</text>
  </g>

  <!-- Floating Pill 3: Continuous Monitoring -->
  <g class="floating-card-3" transform="translate(740, 190)">
    <rect width="170" height="38" rx="19" fill="#0f172a" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" />
    <circle cx="18" cy="19" r="5" fill="#a855f7" />
    <text x="32" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Automated Audit 99.8%</text>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Chip / Pill -->
  <g transform="translate(70, 48)">
    <rect width="320" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="21" class="badge-text">🛡️ ENTERPRISE GRC &amp; REGULATORY RADAR</text>
  </g>

  <!-- Main Title with Gradient Fill -->
  <g transform="translate(70, 135)">
    <text class="title-text">
      Global Compliance <tspan fill="url(#accentGrad)">Management</tspan>
    </text>
  </g>

  <!-- Subtitle (Always in foreground, crystal clear) -->
  <g transform="translate(72, 178)">
    <text class="subtitle-text">
      Continuous Control Monitoring • Multi-Jurisdictional Audits • Regulatory Change Intelligence
    </text>
  </g>

  <!-- Secondary Highlights Bar (Pills & Framework tags) -->
  <g transform="translate(72, 222)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="82" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="41" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">GDPR</text>

    <!-- Tag 2 -->
    <rect x="92" y="0" width="92" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="138" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ISO 27001</text>

    <!-- Tag 3 -->
    <rect x="194" y="0" width="82" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="235" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">SOC 2</text>

    <!-- Tag 4 -->
    <rect x="286" y="0" width="82" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="327" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">HIPAA</text>

    <!-- Tag 5 -->
    <rect x="378" y="0" width="92" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="424" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">FedRAMP</text>

    <!-- Tag 6 -->
    <rect x="480" y="0" width="82" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="521" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">NIS2/DORA</text>
  </g>

  <!-- Metric Badges Row (Bottom Left Foreground) -->
  <g transform="translate(72, 280)">
    <g transform="translate(0, 0)">
      <text y="0" class="metric-label">Market Velocity</text>
      <text y="22" class="metric-val">$51B ➔ $80B+</text>
    </g>
    <line x1="140" y1="-5" x2="140" y2="28" stroke="#334155" stroke-width="1" />

    <g transform="translate(160, 0)">
      <text y="0" class="metric-label">Sector Dynamics</text>
      <text y="22" class="metric-val">Highly Fragmented</text>
    </g>
    <line x1="330" y1="-5" x2="330" y2="28" stroke="#334155" stroke-width="1" />

    <g transform="translate(350, 0)">
      <text y="0" class="metric-label">Ecosystem Coverage</text>
      <text y="22" class="metric-val">SaaS &amp; Open-Source</text>
    </g>
  </g>

</svg>
